services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver-container
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=MyPassword@123
      - MSSQL_PID=Express
    ports:
      - "1434:1433"
    restart: always
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "MyPassword@123", "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Thêm dịch vụ Redis vào Docker Compose
  redis:
    image: redis:alpine
    container_name: aicustomersupport-redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  csharp-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: csharp-backend-container
    ports:
      - "5145:5145"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5145
      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=AICustomerSupportDb;User Id=sa;Password=MyPassword@123;TrustServerCertificate=True;
      - ConnectionStrings__Redis=redis:6379  
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy 
    restart: always

  ai-service:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
    container_name: ai-service-container
    ports:
      - "8001:8001"
    environment:
      - CSHARP_BACKEND_URL=http://csharp-backend:5145
      - REDIS_HOST=redis                  
      - CHROMA_SERVER_NO_ANONYMIZED_TELEMETRY=true
      - ANONYMIZED_TELEMETRY=false
      - POSTHOG_DISABLED=True
      - OPENAI_API_KEY=ollama  
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
      - PYTHONHTTPSVERIFY=0
      - HF_HUB_DISABLE_SSL_VERIFICATION=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - csharp-backend
      - redis
    restart: always

  celery-worker:
    build:
      context: ./src/ai-service
      dockerfile: Dockerfile
    container_name: celery-worker-container
    command: celery -A celery_app worker --loglevel=info -P solo
    environment:
      - CSHARP_BACKEND_URL=http://csharp-backend:5145
      - REDIS_HOST=redis
      - OPENAI_API_KEY=ollama  
      - OPENAI_BASE_URL=http://host.docker.internal:11434/v1
    depends_on:
      - redis
      - ai-service
    restart: always